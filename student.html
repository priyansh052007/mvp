<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>School</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
  <link href="student.css" rel="stylesheet">
</head>

<body>

  <div class="app">

    <div class="profile" id="profile">

      <div class="profile_header">
        <div onclick="openMainProfile()">Student</div>
        <span class="material-symbols-rounded profile_header_icon" onclick="closeProfile()">close</span>
      </div>
      <div class="profile_content">
        <span>Student</span>
      </div>

    </div>
    
    <div class="main_profile" id="main_profile">

      <div class="main_profile_header">
        <div class="m_p_h_tab" onclick="closeMainProfile()">
          <span class="material-symbols-rounded main_profile_header_icon">arrow_back_ios_new</span>
        </div>
        <div class="m_p_h_tab">Student</div>
        <div class="m_p_h_tab"></div>
      </div>
      <div class="main_profile_user">
        <div class="main_profile_user_details">
          <div class="m_p_u_text">
            <span>DEMO USER</span>
            <span>demo@abcd.com</span>
          </div>
          <div class="m_p_u_image">
            <span>DU</span>
          </div>
        </div>
        <div class="main_profile_user_features">
          <div class="m_p_u_year">Year 2025</div>
          <div class="m_p_u_ai">AI</div>
        </div>
      </div>
      <div class="main_profile_content">
        <span>Student</span>
      </div>

    </div>

    <div class="features">

      <div class="header">
        <span id="header_1">School</span>
        <span class="material-symbols-rounded header_icon" onclick="openProfile()">arrow_downward_alt</span>
      </div>

      <div class="tabs">
        <span class="tab" id="tab_1" onclick="selectOption('a')">School</span>
        <span class="tab" id="tab_2" onclick="selectOption('b')">Event</span>
        <span class="tab" id="tab_3" onclick="selectOption('c')">Calendar</span>
        <span class="tab" id="tab_4" onclick="selectOption('d')">Attendance</span>
        <span class="tab" id="tab_5" onclick="selectOption('e')">Notification</span>
      </div>

      <div class="content">
        <span id="content_1">School</span>
      </div>

      <div class="main_tabs">
        <div class="main_tab" onclick="selectTab('school')"><span class="material-symbols-rounded main_tabs_icon">school</span>School</div>
        <div class="main_tab" onclick="selectTab('class')"><span class="material-symbols-rounded main_tabs_icon">cast_for_education</span>Class</div>
        <div class="main_tab" onclick="selectTab('subject')"><span class="material-symbols-rounded main_tabs_icon">book</span>Subject</div>
        <div class="main_tab" onclick="selectTab('teacher')"><span class="material-symbols-rounded main_tabs_icon">groups_3</span>Teacher</div>
        <div class="main_tab" onclick="selectTab('timetable')"><span class="material-symbols-rounded main_tabs_icon">calendar_clock</span>Timetable</div>
      </div>

    </div>

  </div>

  <script src="student.js"></script>

</body>

</html>
