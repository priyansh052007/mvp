<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>School</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
  <link href="student.css" rel="stylesheet">
</head>

<body>

  <div class="app">

    <div class="profile" id="profile">

      <div class="profile_header">
        <div onclick="openMainProfile()">Student</div>
        <span class="material-symbols-rounded profile_header_icon" onclick="closeProfile()">close</span>
      </div>
      <div class="profile_content">
        <span>Student</span>
      </div>

    </div>
    
    <div class="main_profile" id="main_profile">

      <div class="main_profile_header">
        <div class="m_p_h_tab" onclick="closeMainProfile()">
          <span class="material-symbols-rounded main_profile_header_icon">arrow_back_ios_new</span>
        </div>
        <div class="m_p_h_tab">Student</div>
        <div class="m_p_h_tab"></div>
      </div>
      <div class="main_profile_user">
        <div class="main_profile_user_details">
          <div class="m_p_u_text">
            <span>DEMO USER</span>
            <span>demo@abcd.com</span>
          </div>
          <div class="m_p_u_image">
            <span>DU</span>
          </div>
        </div>
        <div class="main_profile_user_features">
          <div class="m_p_u_year">Year 2025</div>
          <div class="m_p_u_ai">AI</div>
        </div>
      </div>
      <div class="main_profile_content">
        <span>Student</span>
      </div>

    </div>

    <div class="features">

      <div class="header">
        <span id="header_1">School</span>
        <span class="material-symbols-rounded header_icon" onclick="openProfile()">arrow_downward_alt</span>
      </div>

    </div>
    
</body>

</html>
