<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>School</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
  <style>
   * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  overflow: hidden;
  font-family: 'Roboto', sans-serif;
}

.app {
  inset: 0;
  height: 100dvh;
  width: 100vw;
}

.profile {
  position: fixed;
  z-index: 1;
  inset: 0;
  height: 45dvh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  transform: translateY(-100%);
  transition: transform 0.5s ease;
}
.profile.active {
  transform: translateY(0);
}

.profile_header {
  height: 5dvh;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #eaebec;
  color: #42424f;
  padding: 0dvh 2vw 0dvh 2.5vw;
  font-size: 50px;
  font-weight: bold;
}
.profile_header .profile_header_icon {
  font-size: 75px;
}

.profile_content {
  height: 40dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #eaebec;
  color: #42424f;
  padding: 0dvh 2vw 0dvh 2.5vw;
  font-size: 25px;
}

.main_profile {
  position: fixed;
  z-index: 2;
  inset: 0;
  height: 100dvh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.5s ease;
}
.main_profile.active {
  transform: translateX(0);
}

.main_profile_header {
  height: 20dvh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background: #eaebec;
  color: #42424f;
  padding: 0dvh 0vw 0dvh 0vw;
  font-size: 50px;
  font-weight: bold;
}
.main_profile_header .m_p_h_tab {
  height: 5dvh;
  width: 33vw;
  display: flex;
  align-items: center;
}
.main_profile_header .m_p_h_tab:first-child {
  justify-content: flex-start;
}
.main_profile_header .m_p_h_tab:not(:first-child) {
  justify-content: center;
}
.main_profile_header_icon {
  font-size: 65px;
  padding: 0.25dvh 0vw 0dvh 0vw;
}

.main_profile_user {
  position: fixed;
  z-index: 5;
  left: 7.5vw;
  top: 7dvh;
  height: 28dvh;
  width: 85vw;
  display: flex;
  flex-direction: column;
}
.main_profile_user .main_profile_user_details {
  height: 22dvh;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fff;
  border-radius: 24px 24px 0px 0px;
  padding: 0dvh 3.5vw 0dvh 3.5vw;
}
.m_p_u_text {
  display: flex;
  flex-direction: column;
}
.m_p_u_text span:first-child {
  font-size: 45px;
  color: #424250;
}
.m_p_u_text span:last-child {
  font-size: 32px;
  color: #9c9caf;
}
.m_p_u_image {
  height: 18dvh;
  aspect-ratio: 1 / 1;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #e7f0fd;
  color: #9ec0f8;
  font-size: 75px;
  border-radius: 50%;
}
.main_profile_user .main_profile_user_features {
  height: 4dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fafafb;
  color: #424250;
  font-size: 30px;
  border-radius: 0px 0px 24px 24px;
  padding: 0dvh 2.5vw 0dvh 2.5vw;
}
.m_p_u_year, .m_p_u_ai {
  width: 40vw;
  display: flex;
  justify-content: center;
  align-items: center;
}

.main_profile_content {
  height: 79dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffffe;
  color: #42424f;
  padding: 0dvh 2vw 0dvh 2vw;
  font-size: 25px;
}

.features {
  inset: 0;
  height: 100dvh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  transition: transform 0.5s ease;
}

.header {
  height: 5dvh;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #eaebec;
  color: #42424f;
  padding: 0dvh 2vw 0dvh 2.5vw;
  font-size: 50px;
  font-weight: bold;
}
.header .header_icon {
  font-size: 90px;
}
  </style>

</head>

<body>

  <div class="app">

    <div class="profile" id="profile">

      <div class="profile_header">
        <div onclick="openMainProfile()">Student</div>
        <span class="material-symbols-rounded profile_header_icon" onclick="closeProfile()">close</span>
      </div>
      <div class="profile_content">
        <span>Student</span>
      </div>

    </div>
    
    <div class="main_profile" id="main_profile">

      <div class="main_profile_header">
        <div class="m_p_h_tab" onclick="closeMainProfile()">
          <span class="material-symbols-rounded main_profile_header_icon">arrow_back_ios_new</span>
        </div>
        <div class="m_p_h_tab">Student</div>
        <div class="m_p_h_tab"></div>
      </div>
      <div class="main_profile_user">
        <div class="main_profile_user_details">
          <div class="m_p_u_text">
            <span>DEMO USER</span>
            <span>demo@abcd.com</span>
          </div>
          <div class="m_p_u_image">
            <span>DU</span>
          </div>
        </div>
        <div class="main_profile_user_features">
          <div class="m_p_u_year">Year 2025</div>
          <div class="m_p_u_ai">AI</div>
        </div>
      </div>
      <div class="main_profile_content">
        <span>Student</span>
      </div>

    </div>

    <div class="features">

      <div class="header">
        <span id="header_1">School</span>
        <span class="material-symbols-rounded header_icon" onclick="openProfile()">arrow_downward_alt</span>
      </div>

    </div>
    
    
      <script>
  const features = document.querySelector(".features");
const profile = document.getElementById("profile");
const main_profile = document.getElementById("main_profile");

function openProfile() {
  features.style.pointerEvents = "none";
  features.style.userSelect = 'none';
  features.style.webkitUserDrag = 'none';
  features.style.opacity = "0.4";
  features.style.transform = "translateY(45dvh)";
  profile.classList.add("active");
}

function closeProfile() {
  profile.classList.remove("active");
  features.style.transform = "translateY(0)";
  features.style.opacity = "1";
  features.style.userSelect = 'auto';
  features.style.webkitUserDrag = 'auto';
  features.style.pointerEvents = "auto";
}

function openMainProfile() {
  profile.classList.remove("active");
  features.style.transform = "translateY(0)";
  features.style.transform = "translateX(-100vw)";
  main_profile.classList.add("active");
}

function closeMainProfile() {
  main_profile.classList.remove("active");
  features.style.transform = "translateX(0)";
  features.style.opacity = "1";
  features.style.userSelect = 'auto';
  features.style.webkitUserDrag = 'auto';
  features.style.pointerEvents = "auto";
}

  </script>
    
    
    
</body>

</html>
